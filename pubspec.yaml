name: agent_ampel
description: "Agent-Ampel & Usage-HUD (4-Kammer-Echtzeit-Ampel & Multi-Provider Quota-Tracker)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.16
  window_manager: ^0.4.3
  hotkey_manager: ^0.2.3
  tray_manager: ^0.2.4
  launch_at_startup: ^0.5.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
