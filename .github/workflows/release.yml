name: Multi-Platform Release & Play Store Deployment

on:
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: 'stable'
  APP_PACKAGE_NAME: 'dev.nairolf.tokentracker'

jobs:
  # ============================================================================
  # 0. Version: every build gets the same name, so the in-app updater matches the tag.
  # ============================================================================
  meta:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # 1. Quality gate (analyze + tests) once, before the platform builds
  # ============================================================================
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # ============================================================================
  # 2. Windows (ZIP for the self-updater + Inno Setup installer)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    needs: [meta, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package ZIP and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/AgentLights-windows-x64.zip" -Force
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.meta.outputs.version }}" installer/agent_lights.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/AgentLights-windows-x64.zip
            dist/AgentLights-windows-setup.exe
          if-no-files-found: error

  # ============================================================================
  # 3. Linux
  # ============================================================================
  build-linux:
    name: Build Linux (x64)
    needs: [meta, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 & system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/AgentLights-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/AgentLights-linux-x64.tar.gz
          if-no-files-found: error

  # ============================================================================
  # 4. macOS (unsigned .app; see README for the Gatekeeper note)
  # ============================================================================
  build-macos:
    name: Build macOS
    needs: [meta, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -y "${GITHUB_WORKSPACE}/dist/AgentLights-macos.zip" *.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/AgentLights-macos.zip
          if-no-files-found: error

  # ============================================================================
  # 5. Web (release zip + site artifact for Firebase Hosting)
  # ============================================================================
  build-web:
    name: Build Web
    needs: [meta, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package
        run: |
          mkdir -p dist
          (cd build/web && zip -r "${GITHUB_WORKSPACE}/dist/AgentLights-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/AgentLights-web.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: build/web
          if-no-files-found: error

  # ============================================================================
  # 6. Android APK (GitHub Release) + AAB (Play internal testing)
  # ============================================================================
  build-android:
    name: Build Android (APK + AAB)
    needs: [meta, verify]
    runs-on: ubuntu-latest
    outputs:
      has_play: ${{ steps.play.outputs.has_play }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # A random per-run keystore would make every APK unupdatable for testers, so fail instead.
      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See PLAY_STORE_SETUP.md."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get
      - name: Build APK and AAB
        run: |
          flutter build apk --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AgentLights-android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/AgentLights-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/AgentLights-android.apk
            dist/AgentLights-android.aab
          if-no-files-found: error

      - name: Check Play service account
        id: play
        env:
          PLAY_SECRET: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${PLAY_SECRET}" ]; then echo "has_play=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set: skipping Play upload (see PLAY_STORE_SETUP.md)."
          fi

      # status: draft keeps the upload valid while the Play Console app is still in setup.
      - name: Upload AAB to Play internal testing
        if: steps.play.outputs.has_play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  # ============================================================================
  # 7. GitHub Release with every platform asset
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, build-windows, build-linux, build-macos, build-web, build-android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-release'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Agent Lights ${{ needs.meta.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/AgentLights-windows-x64.zip
            release-assets/AgentLights-windows-setup.exe
            release-assets/AgentLights-linux-x64.tar.gz
            release-assets/AgentLights-macos.zip
            release-assets/AgentLights-web.zip
            release-assets/AgentLights-android.apk
            release-assets/AgentLights-android.aab

  # ============================================================================
  # 8. Firebase Hosting (Spark plan); skipped until the secret and variable exist
  # ============================================================================
  deploy-web:
    name: Deploy web app (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [build-web]
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-site
          path: build/web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .
